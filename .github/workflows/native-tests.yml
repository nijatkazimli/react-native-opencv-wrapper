name: Native Tests

# Heavier than the TS unit tests, so this runs on PRs to main, on manual
# dispatch, and when native sources change. The TS Jest suite still runs in
# ci.yml on every push.
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "ReactNativeOpencvWrapper.podspec"
      - "example/**"
      - ".github/workflows/native-tests.yml"
  workflow_dispatch:

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android (instrumented, real OpenCV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'example/android/**/*.gradle*', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies (library)
        run: npm ci

      - name: Install dependencies (example)
        run: npm ci
        working-directory: example

      # Required for hardware-accelerated emulation on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the created AVD so subsequent runs restore a booted snapshot
      # instead of cold-creating the emulator each time.
      - name: Cache AVD
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests + coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          working-directory: example/android
          script: ./gradlew :nijatk_react-native-opencv-wrapper:createDebugAndroidTestCoverageReport --console=plain

      - name: Upload Android coverage report
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: android-coverage
          path: android/build/reports/coverage/androidTest/debug/connected

  ios-tests:
    name: iOS (XCTest, real OpenCV)
    runs-on: macos-15
    env:
      RN_OPENCV_WITH_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16.1+
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (library)
        run: npm ci

      - name: Install dependencies (example)
        run: npm ci
        working-directory: example

      # The Podfile uses the `cocoapods-patch` plugin, which is declared in
      # example/Gemfile. Install the pinned gems via Bundler so `pod install`
      # has the plugin available.
      - name: Setup Ruby (Bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          working-directory: example
          bundler-cache: true

      # The default OpenCV CocoaPod ships a device-only arm64 slice plus an
      # x86_64 simulator slice (no arm64-simulator slice). On the Apple-silicon
      # runner we therefore build/run the tests as x86_64 under Rosetta so the
      # linker can use OpenCV's simulator slice.
      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            example/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'ReactNativeOpencvWrapper.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install (with test_spec)
        run: bundle exec pod install
        working-directory: example/ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/example/Gemfile

      - name: Run XCTest + coverage
        working-directory: example/ios
        run: |
          set -o pipefail
          echo "Available simulators:"
          xcrun simctl list devices available
          # Pick the newest available iPhone simulator instead of hardcoding a
          # device name that may not exist on the runner image.
          DEST_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[v['udid'] for rt,devs in d.items() if 'iOS' in rt for v in devs if v.get('isAvailable') and v['name'].startswith('iPhone')]; print(ids[-1] if ids else '')")
          if [ -z "$DEST_ID" ]; then
            echo "No available iPhone simulator found"; exit 1
          fi
          echo "Using simulator $DEST_ID"
          # arch=x86_64 forces the OpenCV pod's simulator slice (no arm64-sim slice exists).
          xcodebuild test \
            -workspace ReactNativeOpencvWrapperExample.xcworkspace \
            -scheme ReactNativeOpencvWrapper \
            -destination "id=$DEST_ID,arch=x86_64" \
            -enableCodeCoverage YES \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            -resultBundlePath "$RUNNER_TEMP/rnocv-ios.xcresult"

      - name: Upload iOS result bundle
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/rnocv-ios.xcresult
