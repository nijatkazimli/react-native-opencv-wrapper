sonar.organization=nijatkazimli
sonar.projectKey=nijatkazimli_react-native-opencv-wrapper

sonar.sources=src,android/src/main,ios
sonar.tests=src/__tests__

sonar.exclusions=example/**,lib/**,**/build/**,**/__tests__/**,**/__mocks__/**,**/*.d.ts,**/*.gradle
sonar.test.inclusions=src/__tests__/**/*.test.ts

# Op modules are uniform scaffolding (declaration merging + registration +
# declarative `doc` metadata); their structural similarity is by design, so
# exclude them from copy-paste duplication detection only. All other Sonar
# rules (bugs, code smells, etc.) still apply to these files.
sonar.cpd.exclusions=src/ops/**

sonar.coverage.exclusions=android/**,ios/**,**/__mocks__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
